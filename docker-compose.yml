services:
  postgres:
    image: postgres:15-alpine
    container_name: daftar-moein-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-daftarmoein}
    ports:
      # - "${POSTGRES_PORT:-5432}:5432" # HOST port:container port | this line reads from .env file
      - '5432:5432' # HOST port:container port | this line reads from .env file

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daftar-moein-backend-nestjs
    environment:
      NODE_ENV: ${NODE_ENV}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # DB_USERNAME: ${POSTGRES_USER:-postgres}
      # DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # DB_NAME: ${POSTGRES_DB:-daftarmoein}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - '8736:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
